<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Chore Chart</title>
<style>
  :root {
    --kid: #2f6fde;
    --kid-soft: #eaf1fd;
    --ink: #1d2433;
    --muted: #6b7385;
    --card: #ffffff;
    --line: #e3e6ee;
    --bonus: #e2a400;
    --done: #2e9e5b;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", "Quicksand", "Segoe UI", "Noto Sans", "DejaVu Sans", sans-serif;
    color: var(--ink);
    background: var(--kid-soft);
    transition: background .35s;
    display: flex; flex-direction: column; overflow: hidden;
    font-size: clamp(15px, 2.1vh, 22px);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 1vw;
    padding: 1.2vh 1.6vw; background: var(--kid); color: #fff;
    transition: background .35s;
  }
  .arrow {
    width: clamp(56px, 10vh, 96px); height: clamp(56px, 10vh, 96px);
    border-radius: 50%; background: rgba(255,255,255,.22);
    display: grid; place-items: center; flex: none;
  }
  .arrow:active { background: rgba(255,255,255,.45); transform: scale(.94); }
  .arrow svg { width: 55%; height: 55%; }
  .who { flex: 1; text-align: center; min-width: 0; }
  .who .name { font-size: clamp(28px, 6.5vh, 64px); font-weight: 800; line-height: 1.05; letter-spacing: .01em; }
  .who .dots { display: flex; justify-content: center; gap: 8px; margin-top: .6vh; }
  .who .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .who .dots i.on { background: #fff; }
  .meta { text-align: right; flex: none; display: flex; align-items: center; gap: 1.2vw; }
  .meta .clock { font-size: clamp(16px, 3vh, 30px); font-weight: 700; line-height: 1.1; }
  .meta .date { font-size: .85em; opacity: .9; }
  .histbtn {
    width: clamp(48px, 8vh, 76px); height: clamp(48px, 8vh, 76px); border-radius: 14px;
    background: rgba(255,255,255,.22); display: grid; place-items: center;
  }
  .histbtn svg { width: 55%; height: 55%; }

  .viewing {
    display: none; background: #fff6d6; color: #6b5200; text-align: center;
    padding: .8vh 1vw; font-weight: 700;
  }
  .viewing.show { display: block; }
  .viewing button { text-decoration: underline; font-weight: 800; color: inherit; margin-left: .5em; }

  /* ---------- section tabs ---------- */
  nav { display: flex; gap: 1.2vw; padding: 1.4vh 1.6vw .4vh; }
  .tab {
    flex: 1; background: var(--card); border-radius: var(--radius); padding: 1.1vh 1vw;
    display: flex; align-items: center; gap: .8vw; border: 3px solid transparent;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .tab.sel { border-color: var(--kid); }
  .tab .ico { font-size: 1.7em; line-height: 1; }
  .tab .lbl { flex: 1; text-align: left; min-width: 0; }
  .tab .lbl b { display: block; font-size: 1.1em; }
  .tab .bar { height: 8px; border-radius: 4px; background: var(--line); margin-top: .5vh; overflow: hidden; }
  .tab .bar span { display: block; height: 100%; background: var(--kid); width: 0; transition: width .3s; }
  .tab .count { font-weight: 800; color: var(--muted); white-space: nowrap; }
  .tab.complete .count { color: var(--done); }
  .tab.now::after {
    content: "NOW"; font-size: .6em; font-weight: 800; letter-spacing: .08em;
    background: var(--kid); color: #fff; padding: 2px 6px; border-radius: 6px; align-self: flex-start;
  }

  /* ---------- chores ---------- */
  main { flex: 1; overflow-y: auto; padding: 1vh 1.6vw 2vh; -webkit-overflow-scrolling: touch; }
  .grid {
    display: grid; gap: 1.2vh 1.2vw;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  }
  .chore {
    display: flex; align-items: center; gap: 1.2vw; text-align: left;
    background: var(--card); border-radius: var(--radius); padding: 1.3vh 1.2vw;
    min-height: clamp(60px, 9.5vh, 100px); box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: transform .08s, background .2s;
  }
  .chore:active { transform: scale(.98); }
  .box {
    flex: none; width: clamp(40px, 6.5vh, 64px); height: clamp(40px, 6.5vh, 64px);
    border-radius: 12px; border: 3px solid #b8bfcc; display: grid; place-items: center; background: #fff;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 80%; height: 80%; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s cubic-bezier(.3,1.6,.6,1); }
  .chore .txt { flex: 1; font-size: 1.15em; font-weight: 700; line-height: 1.2; }
  .tag { display: inline-block; font-size: .7em; font-weight: 800; color: #7a5a00; background: #fff1c2;
         border-radius: 6px; padding: 2px 7px; margin-top: 4px; letter-spacing: .03em; }
  .chore.bonus .box { border-style: dashed; border-color: var(--bonus); }
  .chore.done { background: #eef8f1; }
  .chore.done .box { background: var(--done); border-color: var(--done); border-style: solid; }
  .chore.done .box svg { opacity: 1; transform: scale(1); }
  .chore.done .txt { color: #5c7a67; text-decoration: line-through; text-decoration-thickness: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 6vh 0; font-size: 1.2em; }

  /* ---------- celebration ---------- */
  .yay {
    position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 200%);
    background: var(--done); color: #fff; font-weight: 800; font-size: clamp(20px, 4vh, 40px);
    padding: 1.6vh 3vw; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    transition: transform .4s cubic-bezier(.3,1.4,.6,1), opacity .3s; pointer-events: none; white-space: nowrap; opacity: 0;
  }
  .yay.show { transform: translate(-50%, 0); opacity: 1; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; pointer-events: none; z-index: 50;
              animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---------- history ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20,24,35,.45); display: none; z-index: 20; }
  .overlay.show { display: flex; }
  .panel { margin: auto; background: #fff; border-radius: 22px; width: min(94vw, 900px); max-height: 92vh;
           display: flex; flex-direction: column; overflow: hidden; }
  .panel h2 { margin: 0; padding: 2vh 2vw; font-size: 1.4em; display: flex; align-items: center; }
  .panel h2 span { flex: 1; }
  .panel h2 button { font-size: 1.6em; width: 56px; height: 56px; border-radius: 50%; background: #f0f2f6; }
  .hist { overflow-y: auto; padding: 0 2vw 2vh; }
  .hrow { display: grid; grid-template-columns: 9em repeat(var(--n), 1fr); gap: 1.5vw; align-items: center;
          padding: 1.2vh .8vw; border-radius: 12px; width: 100%; text-align: left; }
  .hrow:nth-child(odd) { background: #f6f7fa; }
  .hrow.head { background: none; font-weight: 800; color: var(--muted); }
  .hrow .d { font-weight: 700; }
  .hk { display: flex; align-items: center; gap: .6em; }
  .hk .bar { flex: 1; height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
  .hk .bar span { display: block; height: 100%; }
  .hk .n { font-weight: 800; min-width: 3.6em; text-align: right; }
  .hk .star { color: var(--bonus); font-weight: 800; min-width: 2.2em; }
</style>
</head>
<body>
<header>
  <button class="arrow" id="prev" aria-label="Previous kid">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <div class="who"><div class="name" id="kidName"></div><div class="dots" id="dots"></div></div>
  <button class="arrow" id="next" aria-label="Next kid">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <div class="meta">
    <div><div class="clock" id="clock"></div><div class="date" id="date"></div></div>
    <button class="histbtn" id="histBtn" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15l2.5 2.5L16 13"/></svg>
    </button>
  </div>
</header>
<div class="viewing" id="viewing"></div>
<nav id="tabs"></nav>
<main id="main"><div class="grid" id="grid"></div></main>
<div class="yay" id="yay"></div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2><span>History</span><button id="closeHist" aria-label="Close">×</button></h2>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const IDLE_MS = 3 * 60 * 1000;           // after 3 min untouched, jump back to today + current section
const S = { data: null, kid: 0, section: null, viewDate: null, sectionPinned: false };
const $ = id => document.getElementById(id);

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, opts);
const soft = hex => {                     // light tint of the kid's color for the background
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, m = v => Math.round(v + (255 - v) * .88);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
};

function currentSection() {
  const d = S.data, now = new Date(), hm = now.getHours() * 60 + now.getMinutes();
  let pick = d.kids[0].sections[0].id;
  for (const [id, t] of Object.entries(d.sectionStarts)) {
    const [h, m] = t.split(":").map(Number);
    if (hm >= h * 60 + m) pick = id;
  }
  return pick;
}

async function load() {
  const q = S.viewDate ? "?date=" + S.viewDate : "";
  const r = await fetch("/api/day" + q);
  const d = await r.json();
  if (d.error) { $("grid").innerHTML = `<div class="empty">Problem loading chores: ${esc(d.error)}</div>`; return; }
  S.data = d;
  if (!S.section || !S.sectionPinned) S.section = currentSection();
  render();
}

function counts(sec) {
  const req = sec.chores.filter(c => !c.bonus);
  return { done: req.filter(c => c.done).length, total: req.length };
}

function render() {
  const d = S.data, kid = d.kids[S.kid];
  document.documentElement.style.setProperty("--kid", kid.color);
  document.documentElement.style.setProperty("--kid-soft", soft(kid.color));
  $("kidName").textContent = kid.name + "’s Chores";
  $("dots").innerHTML = d.kids.map((_, i) => `<i class="${i === S.kid ? "on" : ""}"></i>`).join("");

  const v = $("viewing");
  if (S.viewDate && S.viewDate !== d.today) {
    v.innerHTML = `Looking at ${fmtDate(S.viewDate, { weekday: "long", month: "short", day: "numeric" })}<button id="backToday">Back to today</button>`;
    v.classList.add("show");
    $("backToday").onclick = goToday;
  } else v.classList.remove("show");

  const nowSec = (!S.viewDate || S.viewDate === d.today) ? currentSection() : null;
  $("tabs").innerHTML = kid.sections.map(sec => {
    const c = counts(sec), pct = c.total ? Math.round(100 * c.done / c.total) : 100;
    const cls = ["tab", sec.id === S.section && "sel", c.done === c.total && c.total && "complete", sec.id === nowSec && "now"].filter(Boolean).join(" ");
    return `<button class="${cls}" data-sec="${sec.id}">
      <span class="ico">${sec.icon}</span>
      <span class="lbl"><b>${esc(sec.name)}</b><span class="bar"><span style="width:${pct}%"></span></span></span>
      <span class="count">${c.done === c.total && c.total ? "✓ " : ""}${c.done}/${c.total}</span></button>`;
  }).join("");

  const sec = kid.sections.find(s => s.id === S.section);
  $("grid").innerHTML = sec.chores.length ? sec.chores.map(c => `
    <button class="chore${c.done ? " done" : ""}${c.bonus ? " bonus" : ""}" data-id="${c.id}">
      <span class="box">${CHECK}</span>
      <span class="txt">${esc(c.name)}${c.bonus ? '<br><span class="tag">★ BONUS</span>' : ""}</span>
    </button>`).join("") : `<div class="empty">Nothing to do here today 🎉</div>`;
}

async function toggle(id) {
  const kid = S.data.kids[S.kid], sec = kid.sections.find(s => s.id === S.section);
  const c = sec.chores.find(x => x.id === id);
  const before = counts(sec);
  c.done = !c.done;                       // update the screen right away
  render();
  const after = counts(sec);
  if (c.done && after.total && after.done === after.total && before.done < before.total) celebrate(`${sec.name} done, ${kid.name}! 🎉`);
  try {
    const r = await fetch("/api/toggle", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: S.data.date, kid: kid.id, chore: id }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    c.done = j.done;
  } catch (e) { c.done = !c.done; render(); }
}

function celebrate(msg) {
  const y = $("yay"); y.textContent = msg; y.classList.add("show");
  setTimeout(() => y.classList.remove("show"), 2600);
  const colors = ["#f94144", "#f8961e", "#f9c74f", "#90be6d", "#43aa8b", "#577590", "#c2417a"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    p.style.animationDelay = Math.random() * .4 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function switchKid(step) {
  const n = S.data.kids.length;
  S.kid = (S.kid + step + n) % n;
  render();
  $("main").scrollTop = 0;
}

function goToday() { S.viewDate = null; S.sectionPinned = false; load(); }

async function showHistory() {
  const h = await (await fetch("/api/history?days=14")).json();
  let html = `<div class="hrow head" style="--n:${h.kids.length}"><span></span>${h.kids.map(k => `<span>${esc(k.name)}</span>`).join("")}</div>`;
  html += h.days.map((day, i) => `
    <button class="hrow" style="--n:${h.kids.length}" data-date="${day.date}">
      <span class="d">${i === 0 ? "Today" : fmtDate(day.date, { weekday: "short", month: "short", day: "numeric" })}</span>
      ${h.kids.map(k => { const s = day.kids[k.id], pct = s.total ? 100 * s.done / s.total : 0;
        return `<span class="hk"><span class="bar"><span style="width:${pct}%;background:${k.color}"></span></span>
          <span class="n">${s.done}/${s.total}</span><span class="star">${s.bonusDone ? "★" + s.bonusDone : ""}</span></span>`; }).join("")}
    </button>`).join("");
  $("hist").innerHTML = html;
  $("overlay").classList.add("show");
}

// ---------- events ----------
$("prev").onclick = () => switchKid(-1);
$("next").onclick = () => switchKid(1);
$("tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) { S.section = t.dataset.sec; S.sectionPinned = true; render(); $("main").scrollTop = 0; } };
$("grid").onclick = e => { const c = e.target.closest(".chore"); if (c) toggle(c.dataset.id); };
$("histBtn").onclick = showHistory;
$("closeHist").onclick = () => $("overlay").classList.remove("show");
$("overlay").onclick = e => { if (e.target.id === "overlay") $("overlay").classList.remove("show"); };
$("hist").onclick = e => {
  const r = e.target.closest(".hrow[data-date]"); if (!r) return;
  $("overlay").classList.remove("show");
  S.viewDate = r.dataset.date === S.data.today ? null : r.dataset.date;
  S.sectionPinned = !!S.viewDate;
  load();
};

// swipe left/right anywhere on the list to change kid
let sx = null, sy = 0;
$("main").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("main").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 90 && Math.abs(dx) > 2 * Math.abs(dy)) switchKid(dx < 0 ? 1 : -1);
  sx = null;
}, { passive: true });

// idle reset
let idleTimer;
const poke = () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => { $("overlay").classList.remove("show"); goToday(); }, IDLE_MS); };
["pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, poke, { passive: true }));
poke();

// clock + periodic refresh (picks up midnight rollover, section changes, and checks made from a phone)
function tick() {
  const n = new Date();
  $("clock").textContent = n.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("date").textContent = n.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}
tick(); setInterval(tick, 10000);
setInterval(() => { if (!S.viewDate) load(); }, 30000);
load();
</script>
</body>
</html>
